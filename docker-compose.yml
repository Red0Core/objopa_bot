version: "3.8"

services:
  redis:
    image: redis:alpine
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save ""

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - BACKEND_ROUTE=http://backend:8000
      - MALLOC_ARENA_MAX=2
      - PYTHONMALLOC=malloc
      - PYTHONDONTWRITEBYTECODE=1
    depends_on:
      - redis
    volumes:
      - ./storage:/app/storage
    ports:
      - "8888:8000"

  tg_bot:
    build:
      context: .
      dockerfile: Dockerfile.tg_bot
      args:
        INSTAGRAM_USERNAME: ${INSTAGRAM_USERNAME}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - BACKEND_ROUTE=http://backend:8000
      - MALLOC_ARENA_MAX=2
      - PYTHONMALLOC=malloc
      - PYTHONDONTWRITEBYTECODE=1
      - MAX_CONCURRENT_DOWNLOADS=1
      - MAX_GPT_SESSIONS=8
      - GPT_SESSION_TIMEOUT_SEC=1200
      - RSS_TRIM_THRESHOLD_MB=280
      - FFMPEG_MEMORY_MB=256
    depends_on:
      - redis
      - backend
    volumes:
      - ./storage:/app/storage
